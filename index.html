<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lee's Adventure</title>
    <style>
        :root {
            /* --- V15.2 (白色漁夫帽經典回歸版) --- */
            --bg-color: #FFFBF0;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 240, 200, 0.8);
            --primary: #007AFF; 
            --accent: #FF9F0A; /* 紅蘿蔔橘 */
            --text-main: #2c1e10;
            --text-sub: #8a7f75;
            --shadow: 0 15px 45px rgba(90, 70, 50, 0.1);
            --glow: 0 0 35px rgba(255, 190, 60, 0.6);
            --hat-white: #ffffff; /* 經典白帽 */
            --hat-stroke: #cccccc; /* 白帽邊框 */
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow-x: hidden; position: relative;
            background-color: #FFFBF0;
            background-image: linear-gradient(-45deg, #FFFBF0, #FFEDCC, #FFE0B2, #FFFBE6, #FFD54F);
            background-size: 400% 400%;
            animation: shimmeringWave 18s ease infinite; 
        }

        @keyframes shimmeringWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, transparent 20px);
            background-size: 100% 100%; filter: blur(2px);
        }

        .container { 
            width: 90%; max-width: 800px; padding: 20px; box-sizing: border-box; 
            position: relative; z-index: 1; 
            display: flex; flex-direction: column; align-items: center; gap: 30px;
        }

        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 28px; font-weight: 800; margin: 0 0 5px 0; color: var(--text-main); letter-spacing: -1px; text-shadow: 0 2px 15px rgba(255, 200, 100, 0.4); }
        .header p { font-size: 14px; color: var(--text-sub); margin: 0; font-weight: 500; }

        /* Widget 卡片與頭像 */
        .widget-row { display: flex; justify-content: center; width: 100%; gap: 20px; }
        .widget {
            background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 28px; padding: 20px 25px; 
            box-shadow: var(--shadow); border: 1px solid var(--card-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; flex: 1; transition: transform 0.3s;
        }
        .widget:hover { transform: translateY(-5px); box-shadow: 0 25px 60px rgba(90, 70, 50, 0.2); border-color: var(--accent); }
        .widget-head-icon {
            width: 70px; height: 70px; background: white; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.8); box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 5px; overflow: hidden;
        }
        .widget-head-icon svg { width: 100%; height: 100%; transform: scale(1.2) translateY(5px); }
        .widget-number { font-size: 42px; font-weight: 900; color: var(--text-main); line-height: 1; letter-spacing: -1px; margin-top: 5px;}
        .widget-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-top: 5px; letter-spacing: 1px; }

        /* 跑道與跑者 */
        .timeline-wrapper { width: 100%; position: relative; padding: 80px 0 40px 0; }
        .track-bg { width: 100%; height: 14px; background: rgba(0,0,0,0.05); border-radius: 7px; position: relative; border: 2px solid white;}
        .track-fill { height: 100%; background: linear-gradient(90deg, #FFD700, #FF9F0A); border-radius: 7px; width: 0%; position: relative; transition: width 1s linear; box-shadow: 0 2px 10px rgba(255, 159, 10, 0.4); }
        .runner-group {
            position: absolute; right: -35px; top: -75px; width: 80px; height: 80px; z-index: 10;
            animation: run-bounce 0.6s infinite alternate ease-in-out;
        }
        @keyframes run-bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

        /* 紅蘿蔔里程碑 */
        .milestone {
            position: absolute; top: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; cursor: pointer; z-index: 5; transition: all 0.3s ease;
            display: flex; justify-content: center; align-items: center; font-size: 20px;
        }
        .milestone::before { content: '🥕'; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2)); transition: transform 0.3s; }
        .milestone.passed::before { filter: grayscale(0); transform: scale(1.1); }
        .milestone.locked::before { content: '🔒'; font-size: 14px; filter: grayscale(1); opacity: 0.6; }
        .milestone:hover::before { transform: scale(1.5) rotate(10deg); }

        /* 氣泡與燈箱 */
        .photo-bubble { position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%) scale(0.8); width: 200px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 10px; border-radius: 16px; box-shadow: 0 15px 40px rgba(90, 70, 50, 0.15); border: 1px solid white; opacity: 0; visibility: hidden; pointer-events: none; z-index: 100; text-align: center; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .photo-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; border-width: 8px 8px 0; border-style: solid; border-color: rgba(255,255,255,0.95) transparent transparent transparent; }
        .milestone:hover .photo-bubble { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); bottom: 45px; }
        .photo-bubble img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin-bottom: 5px; background-color: #f0f0f0; }
        .photo-bubble h4 { margin: 5px 0 2px 0; font-size: 14px; font-weight: 800; color: var(--text-main); }
        .photo-bubble span { font-size: 11px; color: var(--text-sub); display: block; margin-bottom: 5px; }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(60, 50, 40, 0.6); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .lightbox.active { opacity: 1; pointer-events: all; }
        .lightbox-content { background: white; padding: 15px; border-radius: 20px; max-width: 90%; text-align: center; transform: scale(0.95); transition: transform 0.3s ease; }
        .lightbox.active .lightbox-content { transform: scale(1); }
        .lightbox img { max-width: 100%; max-height: 60vh; border-radius: 12px; display: block; margin: 0 auto 10px auto; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 30px; cursor: pointer; color: white; }
        .date-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--text-sub); font-weight: 600; }

        /* 左下角 3D 卡片 */
        .flip-card-container { position: fixed; bottom: 20px; left: 20px; width: 100px; height: 140px; perspective: 1000px; z-index: 90; }
        .flip-card { width: 100%; height: 100%; position: relative; transition: transform 0.8s; transform-style: preserve-3d; cursor: pointer; }
        .flip-card-container:hover .flip-card { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .flip-card-front { background: linear-gradient(135deg, #FF9F0A, #FFD700); }
        .flip-card-back { background: white; transform: rotateY(180deg); }
        .flip-card-back img { width: 100%; height: 100%; object-fit: cover; }
        @media (max-width: 600px) { .flip-card-container { width: 80px; height: 110px; bottom: 10px; left: 10px; } }
    </style>
</head>
<body>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="close-btn">&times;</span>
            <img id="lightbox-img" src="" alt="Photo">
            <h4 id="lightbox-title">Title</h4>
            <p id="lightbox-note">Note</p>
        </div>
    </div>

    <div class="flip-card-container">
        <div class="flip-card">
            <div class="flip-card-front">
                <svg width="90%" height="90%" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <path d="M60 35 Q75 20 90 35 Q105 50 60 90 Q15 50 30 35 Q45 20 60 35 Z" fill="#ff3b30" stroke="white" stroke-width="2"/>
                    <g transform="translate(10, 50) scale(0.7)">
                        <circle cx="48" cy="35" r="11" fill="#f5d0c5"/>
                        <circle cx="44" cy="36" r="3.5" stroke="#333" stroke-width="1" fill="none"/>
                        <circle cx="52" cy="36" r="3.5" stroke="#333" stroke-width="1" fill="none"/>
                        <path d="M38 14 L58 14 L61 26 L35 26 Z" fill="white" stroke="#ccc" stroke-width="1"/>
                        <path d="M33 26 Q48 30 63 26" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </g>
                    <g transform="translate(70, 50) scale(0.7)">
                        <path d="M36 35 Q32 55 36 62 L60 62 Q64 55 60 35" fill="#333"/>
                        <circle cx="48" cy="35" r="11" fill="#f5d0c5"/>
                        <path d="M38 14 L58 14 L61 26 L35 26 Z" fill="white" stroke="#ccc" stroke-width="1"/>
                        <path d="M33 26 Q48 30 63 26" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>
            <div class="flip-card-back">
                <img src="https://placehold.co/200x300/FFFAF0/FF9F0A?text=Love+U!" alt="Back">
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>123 Lee's Adventure🫡</h1>
            <p>I luv you, you gut this!</p>
        </div>

        <div class="widget-row">
            <div class="widget w-served">
                <div class="widget-head-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" fill="#e0f7fa"/>
                        <circle cx="50" cy="60" r="25" fill="#f5d0c5"/> <path d="M25 15 L75 15 L80 35 L20 35 Z" fill="white" stroke="#ccc" stroke-width="2"/>
                        <path d="M15 35 Q50 45 85 35" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="40" cy="60" r="8" fill="none" stroke="#333" stroke-width="2"/> <circle cx="60" cy="60" r="8" fill="none" stroke="#333" stroke-width="2"/> <line x1="48" y1="60" x2="52" y2="60" stroke="#333" stroke-width="2"/>
                        <path d="M45 75 Q50 80 55 75" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/> </svg>
                </div>
                <div class="widget-number" id="num-served">0</div>
                <div class="widget-label">Days Served</div>
            </div>
        </div>

        <div class="timeline-wrapper">
            <div class="track-bg">
                <div class="track-fill" id="progress-bar">
                    <div class="runner-group">
                       <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g transform="translate(-10, 10)">
                                <path d="M40 85 L40 60 L55 60 L55 85" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/>
                                <path d="M48 60 L48 45" stroke="#1D1D1F" stroke-width="3"/>
                                <circle cx="48" cy="35" r="11" fill="#f5d0c5"/>
                                <circle cx="44" cy="36" r="3.5" stroke="#333" stroke-width="1" fill="none"/>
                                <circle cx="52" cy="36" r="3.5" stroke="#333" stroke-width="1" fill="none"/>
                                <path d="M38 14 L58 14 L61 26 L35 26 Z" fill="white" stroke="#ccc" stroke-width="1"/>
                                <path d="M33 26 Q48 30 63 26" fill="none" stroke="white" stroke-width="3"/>
                            </g>
                            <g transform="translate(20, 15)">
                                <path d="M40 85 L40 60 L55 60 L55 85" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/>
                                <path d="M48 60 L48 45" stroke="#1D1D1F" stroke-width="3"/>
                                <path d="M36 35 Q32 55 36 62 L60 62 Q64 55 60 35" fill="#333"/>
                                <circle cx="48" cy="35" r="11" fill="#f5d0c5"/>
                                <path d="M38 14 L58 14 L61 26 L35 26 Z" fill="white" stroke="#ccc" stroke-width="1"/>
                                <path d="M33 26 Q48 30 63 26" fill="none" stroke="white" stroke-width="3"/>
                            </g>
                        </svg>
                    </div>
                </div>
                <div id="milestones-layer"></div>
            </div>
            <div class="date-labels">
                <span>Start: 10/21</span>
                <span>End: 01/21</span>
            </div>
        </div>

        <div class="widget-row">
            <div class="widget w-left">
                 <div class="widget-head-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" fill="#fffbe6"/>
                        <path d="M30 50 Q25 80 35 90 L65 90 Q75 80 70 50" fill="#333"/> <circle cx="50" cy="60" r="25" fill="#f5d0c5"/> <path d="M25 15 L75 15 L80 35 L20 35 Z" fill="white" stroke="#ccc" stroke-width="2"/>
                        <path d="M15 35 Q50 45 85 35" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <path d="M35 58 L45 58 L45 65 Q40 68 35 65 Z" fill="#333"/> <path d="M55 58 L65 58 L65 65 Q60 68 55 65 Z" fill="#333"/>
                        <line x1="45" y1="59" x2="55" y2="59" stroke="#333" stroke-width="2"/>
                        <path d="M45 75 Q50 82 55 75" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/> </svg>
                </div>
                <div class="widget-number" id="num-left" style="color: var(--primary);">0</div>
                <div class="widget-label">Days Left</div>
            </div>
        </div>
    </div>

    <script>
        const config = {
            startDate: "2025-10-21",
            endDate: "2026-01-21",
            mockCurrentDate: null, 
            
            memories: [
                { date: "2025-10-21", title: "入伍第一天", img: "p1.jpg", note: "生日許願，重要的儀式感" },
                { date: "2025-10-31", title: "第一次放假", img: "p2.jpg", note: "第一次看到識別證" },
                { date: "2025-11-08", title: "放假囉", img: "p3.jpg", note: "新竹偷偷見" },
                { date: "2025-11-15", title: "放假囉", img: "p4.jpg", note: "台北吃好吃的" },
                { date: "2025-11-22", title: "放假囉", img: "p5.jpg", note: "收護手霜包裹" },
            ],
            futureDates: [ "2025-11-29", "2025-12-06", "2025-12-08", "2025-12-13", "2025-12-18" ]
        };

        const mysteryTexts = [ "美好的事正在發生 ⏳", "未來的我們 💑", "倒數中的小確幸 ✨", "想念正在累積中 📦", "下一次的擁抱 🫂", "期待與你見面 ❤️", "故事未完待續 📖", "準備解鎖新回憶 🔓" ];

        let allMilestones = [...config.memories];
        config.futureDates.forEach(date => {
            const randomText = mysteryTexts[Math.floor(Math.random() * mysteryTexts.length)];
            allMilestones.push({ date: date, title: "待解鎖回憶", img: "", note: randomText });
        });
        allMilestones.sort((a, b) => new Date(a.date) - new Date(b.date));

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxNote = document.getElementById('lightbox-note');
        const closeBtn = document.querySelector('.close-btn');

        function openLightbox(imgSrc, title, note) {
            lightboxImg.src = imgSrc;
            lightboxTitle.innerText = title;
            lightboxNote.innerText = note;
            lightbox.classList.add('active');
        }
        function closeLightbox() { lightbox.classList.remove('active'); }
        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerHTML = end;
            };
            window.requestAnimationFrame(step);
        }

        function init() {
            const start = new Date(config.startDate);
            const end = new Date(config.endDate);
            const now = config.mockCurrentDate ? new Date(config.mockCurrentDate) : new Date();
            const totalTime = end - start;
            const elapsedTime = now - start;
            let percent = (elapsedTime / totalTime) * 100;
            if(percent < 0) percent = 0; if(percent > 100) percent = 100;

            const msPerDay = 1000 * 60 * 60 * 24;
            const served = Math.floor((now - start) / msPerDay);
            const left = Math.ceil((end - now) / msPerDay);

            animateValue("num-served", 0, served > 0 ? served : 0, 1500);
            animateValue("num-left", (left > 0 ? left : 0) + 30, left > 0 ? left : 0, 1500);

            document.getElementById('progress-bar').style.width = percent + "%";

            const layer = document.getElementById('milestones-layer');
            allMilestones.forEach(m => {
                const mDate = new Date(m.date);
                const pos = ((mDate - start) / totalTime) * 100;
                
                if(pos >= 0 && pos <= 100) {
                    const dot = document.createElement('div');
                    const isPassed = mDate <= now;
                    const isLocked = mDate > now;
                    dot.className = `milestone ${isPassed ? 'passed' : ''} ${isLocked ? 'locked' : ''}`;
                    dot.style.left = pos + "%";
                    
                    let imgSrc, clickAction, hintText;
                    if (isLocked) {
                        const placeholderText = encodeURIComponent("LOCKED");
                        imgSrc = `https://placehold.co/400x300/CCCCCC/999999?text=${placeholderText}`;
                        clickAction = null;
                        hintText = "Wait for it... 🔒";
                    } else {
                        const placeholderText = encodeURIComponent(m.note.substring(0, 10));
                        imgSrc = m.img ? m.img : `https://placehold.co/400x300/E5E5EA/8E8E93?text=${placeholderText}`;
                        clickAction = () => openLightbox(imgSrc, m.title, m.date.slice(5) + ' · ' + m.note);
                        hintText = "Tap to enlarge";
                    }

                    dot.innerHTML = `
                        <div class="photo-bubble">
                            <div style="overflow: hidden; border-radius: 10px; margin-bottom: 8px;">
                                <img src="${imgSrc}" class="${isLocked ? 'locked-blur' : ''}" alt="${m.title}">
                            </div>
                            <h4>${m.title}</h4>
                            <span>${m.date.slice(5)} · ${m.note}</span>
                            <div class="click-hint">${hintText}</div>
                        </div>
                    `;
                    if (clickAction) dot.addEventListener('click', clickAction);
                    layer.appendChild(dot);
                }
            });
        }
        setTimeout(init, 100); 
    </script>
</body>
</html>
