<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lee's Adventure</title>
    <style>
        :root {
            /* --- V12.2 PNG修復版 --- */
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(255, 240, 200, 0.8);
            --primary: #007AFF; 
            --accent: #FF9F0A;
            --text-main: #2c1e10;
            --text-sub: #8a7f75;
            --shadow: 0 15px 45px rgba(90, 70, 50, 0.1);
            --glow: 0 0 35px rgba(255, 190, 60, 0.7);
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow-x: hidden; position: relative;
            
            /* 背景流動 */
            background-color: #FFFBF0;
            background-image: linear-gradient(-45deg, #FFFBF0, #FFEDCC, #FFE0B2, #FFFBE6, #FFD54F);
            background-size: 400% 400%;
            animation: shimmeringWave 18s ease infinite; 
        }

        @keyframes shimmeringWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 頂層閃亮波光特效 */
        body::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.5) 0%, transparent 8px),
                radial-gradient(circle at 80% 10%, rgba(255, 220, 120, 0.4) 0%, transparent 12px),
                radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.4) 0%, transparent 6px),
                radial-gradient(circle at 70% 60%, rgba(255, 230, 150, 0.3) 0%, transparent 15px),
                radial-gradient(circle at 10% 80%, rgba(255, 255, 255, 0.5) 0%, transparent 10px),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 240, 0.3) 0%, transparent 20px);
            background-size: 100% 100%;
            filter: blur(2px);
            animation: sparklingUp 25s linear infinite;
        }

        @keyframes sparklingUp {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            50% { transform: translateY(-30px) scale(1.05); opacity: 1; }
            100% { transform: translateY(-60px) scale(1); opacity: 0.7; }
        }

        .container { 
            width: 90%; max-width: 800px; padding: 20px; box-sizing: border-box; 
            position: relative; z-index: 1; 
            display: flex; flex-direction: column; align-items: center; gap: 30px;
        }

        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { 
            font-size: 28px; font-weight: 800; margin: 0 0 5px 0; letter-spacing: -1px;
            color: var(--text-main);
            text-shadow: 0 2px 15px rgba(255, 200, 100, 0.4);
        }
        .header p { font-size: 14px; color: var(--text-sub); margin: 0; font-weight: 500; letter-spacing: 0.5px; }

        /* Q版人物樣式修正 */
        .avatar-container {
            width: 85px; height: 85px; 
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 20px rgba(90, 70, 50, 0.15);
            margin-bottom: 5px;
            background-color: #fff; 
            transition: transform 0.3s;
            display: flex; justify-content: center; align-items: center;
        }
        .widget:hover .avatar-container { transform: scale(1.05) rotate(3deg); }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Widget 卡片調整 */
        .widget-row { display: flex; justify-content: center; width: 100%; gap: 20px; }
        .widget {
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 28px; padding: 20px 25px; 
            box-shadow: var(--shadow); border: 1px solid var(--card-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; flex: 1;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .widget:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 25px 60px rgba(90, 70, 50, 0.2);
            border-color: rgba(255, 220, 120, 1);
        }

        .widget-number { font-size: 48px; font-weight: 900; color: var(--text-main); line-height: 1; letter-spacing: -2px; margin-top: 5px;}
        .widget-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-top: 5px; letter-spacing: 1px; }

        /* --- Timeline --- */
        .timeline-wrapper { width: 100%; position: relative; padding: 70px 0; }
        .track-bg { width: 100%; height: 12px; background: rgba(200, 190, 180, 0.2); border-radius: 6px; position: relative; }
        .track-fill { height: 100%; background: linear-gradient(90deg, #5AC8FA, #007AFF); border-radius: 6px; width: 0%; position: relative; transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4); }
        .runner-box { position: absolute; right: -40px; top: -75px; width: 80px; height: 80px; transition: right 1s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10; }
        .runner-box svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15)); animation: bobbing 0.8s infinite alternate ease-in-out; }
        @keyframes bobbing { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        .milestone { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; background: #FFF8E0; border: 3px solid #D0C0A0; border-radius: 50%; cursor: pointer; z-index: 5; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .milestone.passed { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.2); }
        .milestone:hover { transform: translate(-50%, -50%) scale(1.3); border-color: var(--accent); }
        .milestone.locked { background: #E5E5EA; border-color: #C7C7CC; cursor: default; }
        .milestone.locked::after { content: '🔒'; font-size: 10px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.6; }
        .milestone.locked:hover { transform: translate(-50%, -50%) scale(1.2); border-color: #8E8E93; }
        .photo-bubble { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%) scale(0.8); width: 220px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px; border-radius: 18px; box-shadow: 0 20px 60px rgba(90, 70, 50, 0.15); border: 1px solid var(--card-border); opacity: 0; visibility: hidden; pointer-events: none; z-index: 100; text-align: center; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .photo-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; border-width: 8px 8px 0; border-style: solid; border-color: rgba(255,255,255,0.9) transparent transparent transparent; }
        .milestone:hover .photo-bubble { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); bottom: 60px; box-shadow: 0 30px 70px rgba(90, 70, 50, 0.2), var(--glow); border-color: #FFD080; }
        .milestone.locked:hover .photo-bubble { bottom: 40px; filter: grayscale(100%); opacity: 0.9; }
        .photo-bubble img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background-color: #f0f0f0; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .locked-blur { filter: blur(8px); opacity: 0.7; transform: scale(1.1); clip-path: inset(0); }
        .photo-bubble h4 { margin: 5px 0 2px 0; font-size: 15px; font-weight: 800; color: var(--text-main); }
        .photo-bubble span { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 5px; }
        .click-hint { font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(60, 50, 40, 0.3); backdrop-filter: blur(30px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .lightbox.active { opacity: 1; pointer-events: all; }
        .lightbox-content { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 24px; max-width: 90%; text-align: center; position: relative; transform: scale(0.95); transition: transform 0.3s ease; box-shadow: 0 30px 80px rgba(0,0,0,0.2); }
        .lightbox.active .lightbox-content { transform: scale(1); }
        .lightbox img { max-width: 100%; max-height: 60vh; border-radius: 16px; margin: 0 auto 20px auto; display: block; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 28px; cursor: pointer; opacity: 0.6; }
        .date-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--text-sub); font-weight: 600; width: 100%;}
    </style>
</head>
<body>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="close-btn">&times;</span>
            <img id="lightbox-img" src="" alt="Photo">
            <h4 id="lightbox-title">Title</h4>
            <p id="lightbox-note">Note</p>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>123 Lee's Adventure🫡</h1>
            <p>I luv you, you gut this!</p>
        </div>

        <div class="widget-row">
            <div class="widget w-served">
                <div class="avatar-container">
                    <img src="https://api.dicebear.com/9.x/avataaars/png?seed=MilitaryLee&accessories=prescription02&skinColor=f5d0c5&topType=winterHat4&clotheType=graphicShirt&clotheColor=5c6b46&graphicType=diamond" class="widget-q-icon" alt="Military Q-Version">
                </div>
                <div class="widget-number" id="num-served">0</div>
                <div class="widget-label">Days Served</div>
            </div>
        </div>

        <div class="timeline-wrapper">
            <div class="track-bg">
                <div class="track-fill" id="progress-bar">
                    <div class="runner-box">
                       <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="90" rx="25" ry="4" fill="black" fill-opacity="0.15"/><g transform="translate(15, 10)"><path d="M40 85 L40 60 L55 60 L55 85" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/><path d="M48 60 L48 45" stroke="#1D1D1F" stroke-width="3"/><circle cx="48" cy="35" r="11" fill="#FFD6C9"/><path d="M40 36 L56 36" stroke="#333" stroke-width="1"/><circle cx="43" cy="36" r="3.5" stroke="#333" stroke-width="1" fill="none"/><circle cx="53" cy="36" r="3.5" stroke="#333" stroke-width="1" fill="none"/><path d="M35 26 L61 26 L58 14 L38 14 Z" fill="#F2F2F7" stroke="#8E8E93" stroke-width="1"/><path d="M33 26 Q48 30 63 26" fill="none" stroke="#F2F2F7" stroke-width="4"/><path d="M44 20 C44 20 46 22 48 20 C50 22 52 20 52 20" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/></g><g transform="translate(-15, 15)"><path d="M40 85 L40 60 L55 60 L55 85" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/><path d="M48 60 L48 45" stroke="#1D1D1F" stroke-width="3"/><path d="M36 35 Q32 55 36 62 L60 62 Q64 55 60 35" fill="#333"/><circle cx="48" cy="35" r="11" fill="#FFE0DA"/><path d="M35 26 L61 26 L58 14 L38 14 Z" fill="#F2F2F7" stroke="#8E8E93" stroke-width="1"/><path d="M33 26 Q48 30 63 26" fill="none" stroke="#F2F2F7" stroke-width="4"/><path d="M44 20 C44 20 46 22 48 20 C50 22 52 20 52 20" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/></g></svg>
                    </div>
                </div>
                <div id="milestones-layer"></div>
            </div>
            <div class="date-labels">
                <span>Start: 10/21</span>
                <span>End: 01/21</span>
            </div>
        </div>

        <div class="widget-row">
            <div class="widget w-left">
                 <div class="avatar-container">
                    <img src="https://api.dicebear.com/9.x/avataaars/png?seed=VacationLee&accessories=sunglasses&skinColor=f5d0c5&topType=hat&clotheType=shirtScoopNeck&clotheColor=ff9f0a&mouth=smile" class="widget-q-icon" alt="Vacation Q-Version">
                </div>
                <div class="widget-number" id="num-left" style="color: var(--primary);">0</div>
                <div class="widget-label">Days Left</div>
            </div>
        </div>
    </div>

    <script>
        const config = {
            startDate: "2025-10-21",
            endDate: "2026-01-21",
            mockCurrentDate: null, // 已設為正式時間
            
            memories: [
                { date: "2025-10-21", title: "入伍第一天", img: "p1.jpg", note: "生日許願，重要的儀式感" },
                { date: "2025-10-31", title: "第一次放假", img: "p2.jpg", note: "第一次看到識別證" },
                { date: "2025-11-08", title: "放假囉", img: "p3.jpg", note: "新竹偷偷見" },
                { date: "2025-11-15", title: "放假囉", img: "p4.jpg", note: "台北吃好吃的" },
                { date: "2025-11-22", title: "放假囉", img: "p5.jpg", note: "收護手霜包裹" },
            ],
            futureDates: [ "2025-11-29", "2025-12-06", "2025-12-08", "2025-12-13", "2025-12-18" ]
        };

        const mysteryTexts = [ "美好的事正在發生 ⏳", "未來的我們 💑", "倒數中的小確幸 ✨", "想念正在累積中 📦", "下一次的擁抱 🫂", "期待與你見面 ❤️", "故事未完待續 📖", "準備解鎖新回憶 🔓" ];

        let allMilestones = [...config.memories];
        config.futureDates.forEach(date => {
            const randomText = mysteryTexts[Math.floor(Math.random() * mysteryTexts.length)];
            allMilestones.push({ date: date, title: "待解鎖回憶", img: "", note: randomText });
        });
        allMilestones.sort((a, b) => new Date(a.date) - new Date(b.date));

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxNote = document.getElementById('lightbox-note');
        const closeBtn = document.querySelector('.close-btn');

        function openLightbox(imgSrc, title, note) {
            lightboxImg.src = imgSrc;
            lightboxTitle.innerText = title;
            lightboxNote.innerText = note;
            lightbox.classList.add('active');
        }
        function closeLightbox() { lightbox.classList.remove('active'); }
        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerHTML = end;
            };
            window.requestAnimationFrame(step);
        }

        function init() {
            const start = new Date(config.startDate);
            const end = new Date(config.endDate);
            const now = config.mockCurrentDate ? new Date(config.mockCurrentDate) : new Date();
            const totalTime = end - start;
            const elapsedTime = now - start;
            let percent = (elapsedTime / totalTime) * 100;
            if(percent < 0) percent = 0; if(percent > 100) percent = 100;

            const msPerDay = 1000 * 60 * 60 * 24;
            const served = Math.floor((now - start) / msPerDay);
            const left = Math.ceil((end - now) / msPerDay);

            animateValue("num-served", 0, served > 0 ? served : 0, 1500);
            animateValue("num-left", (left > 0 ? left : 0) + 30, left > 0 ? left : 0, 1500);

            document.getElementById('progress-bar').style.width = percent + "%";

            const layer = document.getElementById('milestones-layer');
            allMilestones.forEach(m => {
                const mDate = new Date(m.date);
                const pos = ((mDate - start) / totalTime) * 100;
                
                if(pos >= 0 && pos <= 100) {
                    const dot = document.createElement('div');
                    const isPassed = mDate <= now;
                    const isLocked = mDate > now;
                    dot.className = `milestone ${isPassed ? 'passed' : ''} ${isLocked ? 'locked' : ''}`;
                    dot.style.left = pos + "%";
                    
                    let imgSrc, clickAction, hintText;
                    if (isLocked) {
                        const placeholderText = encodeURIComponent("LOCKED");
                        imgSrc = `https://placehold.co/400x300/CCCCCC/999999?text=${placeholderText}`;
                        clickAction = null;
                        hintText = "Wait for it... 🔒";
                    } else {
                        const placeholderText = encodeURIComponent(m.note.substring(0, 10));
                        imgSrc = m.img ? m.img : `https://placehold.co/400x300/E5E5EA/8E8E93?text=${placeholderText}`;
                        clickAction = () => openLightbox(imgSrc, m.title, m.date.slice(5) + ' · ' + m.note);
                        hintText = "Tap to enlarge";
                    }

                    dot.innerHTML = `
                        <div class="photo-bubble">
                            <div style="overflow: hidden; border-radius: 10px; margin-bottom: 8px;">
                                <img src="${imgSrc}" class="${isLocked ? 'locked-blur' : ''}" alt="${m.title}">
                            </div>
                            <h4>${m.title}</h4>
                            <span>${m.date.slice(5)} · ${m.note}</span>
                            <div class="click-hint">${hintText}</div>
                        </div>
                    `;
                    if (clickAction) dot.addEventListener('click', clickAction);
                    layer.appendChild(dot);
                }
            });
        }
        setTimeout(init, 100); 
    </script>
</body>
</html>
